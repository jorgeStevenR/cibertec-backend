spring:
  application:
    name: lms
  profiles:
    # En local usa application-local.yml (gitignored). En Render no existe ese archivo:
    # todo lo sensible llega por variables de entorno (ver README.md).
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    hikari:
      # El pooler de Supabase (modo sesión) admite 15 clientes en total: dejar lugar para
      # el entorno local y el desplegado a la vez. Se puede subir con DB_POOL_MAX.
      maximum-pool-size: ${DB_POOL_MAX:5}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  # Render asigna el puerto en la variable PORT.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Anónimo solo ve {"status":"UP"}; no expone detalles de la base ni del disco en un servidor público.
      show-details: when-authorized

lms:
  cors:
    # Orígenes del frontend que pueden llamar a la API, separados por coma.
    # En producción: LMS_CORS_ORIGENES=https://<frontend>.onrender.com
    origenes: ${LMS_CORS_ORIGENES:http://localhost:4200}
  jwt:
    # Valor de desarrollo débil a propósito; el real va en application-local.yml (gitignored) o una variable de entorno en producción.
    secret: ${LMS_JWT_SECRET:cambia-este-valor-en-application-local-yml-o-en-produccion-0000}
    expiracion-minutos: 120
  admin:
    email: admin@cibertec.com
    password: ${LMS_ADMIN_PASSWORD:Admin123!}
  gestor:
    email: gestor@cibertec.com
    password: ${LMS_GESTOR_PASSWORD:Gestor123!}
  almacenamiento:
    # Estos valores reales van en application-local.yml (gitignored) o en variables de entorno; aquí solo hay placeholders.
    endpoint: ${LMS_ALMACENAMIENTO_ENDPOINT:}
    region: ${LMS_ALMACENAMIENTO_REGION:us-west-2}
    bucket: ${LMS_ALMACENAMIENTO_BUCKET:contenidos-lms}
    access-key-id: ${LMS_ALMACENAMIENTO_ACCESS_KEY_ID:}
    secret-access-key: ${LMS_ALMACENAMIENTO_SECRET_ACCESS_KEY:}
    url-firmada-minutos: 15
